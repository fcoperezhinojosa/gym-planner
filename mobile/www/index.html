<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gym Planner</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0f1e;
        color: #f8f9fd;
        font-family: system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .box { padding: 24px; max-width: 320px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #a9baff; margin: 0 0 18px; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        background: #2f55f4;
        color: #fff;
        font-weight: 700;
        padding: 12px 22px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Gym Planner</h1>
      <p>No se pudo cargar la app ahora mismo. Comprueba tu conexión e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
